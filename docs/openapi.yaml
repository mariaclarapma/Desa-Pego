openapi: 3.1.0
info:
  title: desaPego · Módulo 05 (Pedidos, Carteira e Administração)
  version: 1.0.0
  description: |
    Endpoints novos do Módulo 05 (Req. 013, 014 e 015). Pelo site, tudo fica sob `/api`:
    - pedidos, carteira e painel → `/api/gestao/*` (serviço de pedidos, porta 3003)
    - usuárias do painel → `/api/auth/admin/*` (serviço de contas, porta 3002)
    - cadastro com CPF (Req. 001) → `/api/auth/cadastro` (serviço de contas, porta 3002)
    - anúncios e frete do painel → `/api/admin/*` e `/api/config` (catálogo, porta 3001)
    - perfil de vendedora e chave Pix (Req. 002, Módulo 01) → `/api/auth/me/vendedora`, `/api/auth/me/pix`
      e `/api/auth/vendedoras/{id}` (serviço de contas). A chave Pix completa nunca sai em nenhuma resposta
      (veja docs/CHAVE-PIX.md).
    - vitrine com busca, filtros e paginação (Req. 007) → `/api/pecas` (catálogo, porta 3001)

    Dinheiro sempre em **centavos inteiros**. Comissão e taxa do Pix em **pontos-base** (1000 = 10,00%).
    Rotas com login usam o token de acesso do serviço de contas (`Authorization: Bearer …`).
    Rotas do painel: só o perfil `ADMIN_MASTER`; qualquer outro perfil recebe **403**.
servers:
  - url: http://localhost:3000/api
    description: desenvolvimento (pelo proxy do Next.js)
  - url: https://desapego.onrender.com/api
    description: produção

tags:
  - name: pedidos
    description: compras e vendas da usuária logada (Req. 013)
  - name: carteira
    description: saldo, extrato e saques da vendedora (Req. 014)
  - name: admin
    description: painel da administradora master (Req. 014)
  - name: contas
    description: cadastro (Req. 001). O CPF é recebido, mas nunca devolvido em nenhuma resposta.
  - name: interno
    description: chamadas do checkout e do webhook do Pix (Módulo 04), com X-API-Key
  - name: vendedora
    description: perfil de vendedora e chave Pix (Req. 002)
  - name: vitrine
    description: catálogo público, sem login (Req. 007)

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    status:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/StatusPedido" }
  schemas:
    TipoChavePix:
      type: string
      enum: [cpf, email, telefone, aleatoria]
    ChavePixResumo:
      type: object
      description: A chave Pix como a própria vendedora vê. Nunca traz a chave completa.
      required: [tipo, mascarada, atualizadaEm]
      properties:
        tipo: { $ref: "#/components/schemas/TipoChavePix" }
        mascarada: { type: string, examples: ["***.982.247-**", "an***@exemplo.com", "(61) *****-5678", "3f2a****…****9c1d"] }
        atualizadaEm: { type: string, format: date-time }
    PerfilVendedora:
      type: object
      required: [id, nomePublico, nomeNaVitrine, cidade, pix, pixIndisponivel]
      properties:
        id: { type: string, format: uuid }
        nomePublico: { type: [string, "null"], description: "null = a vitrine usa o primeiro nome" }
        nomeNaVitrine: { type: string, description: nome público ou, se vazio, o primeiro nome }
        cidade: { type: [string, "null"] }
        pix:
          oneOf: [{ $ref: "#/components/schemas/ChavePixResumo" }, { type: "null" }]
        pixIndisponivel:
          type: boolean
          description: |
            true = existe uma chave salva que não pode ser lida (PIX_CRIPTO_CHAVE trocada ou cifra corrompida).
            Nesse caso `pix` é null, o token sai com temChavePix false e a vendedora precisa cadastrar de novo.
    PerfilPublicoVendedora:
      type: object
      description: Sem e-mail, nome completo, CPF ou chave Pix.
      required: [id, nomePublico, cidade]
      properties:
        id: { type: string, format: uuid }
        nomePublico: { type: string }
        cidade: { type: [string, "null"] }
    StatusPedido:
      type: string
      enum: [AGUARDANDO_PAGAMENTO, PAGO, ENVIADO, ENTREGUE, CANCELADO]
      description: |
        AGUARDANDO_PAGAMENTO → PAGO (sistema) → ENVIADO (vendedora) → ENTREGUE (compradora).
        CANCELADO a partir de AGUARDANDO_PAGAMENTO (compradora, admin ou sistema) ou de PAGO (admin).
        Qualquer outra transição → 409.
    Item:
      type: object
      required: [id, titulo, precoCentavos]
      properties:
        id: { type: string }
        titulo: { type: string }
        precoCentavos: { type: integer, minimum: 1 }
        categoria: { type: string, enum: [feminino, masculino, calcados, bolsas, acessorios], description: "opcional; usada no painel de vendas" }
    Pedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        compradoraId: { type: string }
        vendedoraId: { type: string }
        itens: { type: array, items: { $ref: "#/components/schemas/Item" } }
        endereco:
          type: object
          additionalProperties: { type: string }
          description: só aparece para a vendedora do pedido
        subtotalCentavos: { type: integer }
        freteCentavos: { type: integer }
        totalCentavos: { type: integer }
        comissaoPontosBase: { type: integer, description: comissão congelada no momento da compra }
        comissaoCentavos: { type: integer }
        taxaPixPontosBase: { type: integer, description: taxa do Pix congelada no momento da compra }
        taxaPixCentavos: { type: integer, description: cobrada sobre o total (peças + frete) }
        vendedoraCentavos: { type: integer, description: "peças + frete − comissão − taxa do Pix; vendedora + comissão + taxa = total" }
        status: { $ref: "#/components/schemas/StatusPedido" }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    Lancamento:
      type: object
      description: |
        Linha do livro-razão. Nunca é alterada nem apagada (no Postgres, um trigger recusa UPDATE e DELETE).
        Cada venda paga gera três: `vendedora`, `comissao` e `taxa_pix`, que somam o total cobrado.
        O saldo da vendedora é a soma só dos lançamentos da conta `vendedora`.
      properties:
        id: { type: string }
        conta: { type: string, enum: [vendedora, comissao, taxa_pix] }
        tipo: { type: string, enum: [venda, liberacao, estorno, repasse] }
        pedidoId: { type: [string, "null"] }
        repasseId: { type: [string, "null"] }
        pendenteCentavos: { type: integer }
        disponivelCentavos: { type: integer }
        criadoEm: { type: string, format: date-time }
    Carteira:
      type: object
      properties:
        pendenteCentavos: { type: integer, description: vendas pagas ainda não recebidas pela compradora }
        disponivelCentavos: { type: integer, description: liberado depois do recebimento }
        emSaqueCentavos: { type: integer, description: saques solicitados e ainda não pagos }
        podeSacarCentavos: { type: integer }
        extrato: { type: array, items: { $ref: "#/components/schemas/Lancamento" } }
    Repasse:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendedoraId: { type: string }
        valorCentavos: { type: integer, minimum: 1 }
        status: { type: string, enum: [SOLICITADO, PAGO] }
        criadoEm: { type: string, format: date-time }
        pagoEm: { type: [string, "null"], format: date-time }
    Usuaria:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        perfil: { type: string, enum: [USUARIO, ADMIN, ADMIN_MASTER] }
        bloqueada: { type: boolean }
        criado_em: { type: string, format: date-time }
    AnuncioAdmin:
      type: object
      properties:
        id: { type: string }
        titulo: { type: string }
        categoria: { type: string }
        precoCentavos: { type: integer }
        status: { type: string, enum: [disponivel, reservada, vendida] }
        oculta: { type: boolean }
        motivoOculta: { type: [string, "null"] }
        irregular: { type: boolean, description: "fora das categorias permitidas (roupas, calçados, bolsas e acessórios)" }
    FaixaPreco:
      type: object
      required: [categoria, condicao, minimoCentavos, maximoCentavos]
      properties:
        categoria: { type: string, enum: [feminino, masculino, calcados, bolsas, acessorios] }
        condicao: { type: string, enum: [nova_com_etiqueta, otimo_estado, bom_estado, com_marcas_de_uso] }
        minimoCentavos: { type: integer, minimum: 1 }
        maximoCentavos: { type: integer, description: não pode ser menor que o mínimo }
    Configuracao:
      type: object
      properties:
        comissaoPontosBase: { type: integer }
        taxaPixPontosBase: { type: integer }
        precosSugeridos: { type: array, items: { $ref: "#/components/schemas/FaixaPreco" } }
    Peca:
      type: object
      description: peça como a vitrine pública mostra (sem os campos internos da administração, como `oculta`)
      required: [id, titulo, categoria, tamanho, condicao, precoCentavos, status, criadoEm]
      properties:
        id: { type: string }
        titulo: { type: string }
        marca: { type: string }
        categoria: { type: string, enum: [feminino, masculino, calcados, bolsas, acessorios] }
        tamanho: { type: string, examples: [M, único, "37"] }
        condicao: { type: string, enum: [nova_com_etiqueta, otimo_estado, bom_estado, com_marcas_de_uso] }
        precoCentavos: { type: integer }
        fotoUrl: { type: string, format: uri }
        fotoAlt: { type: string }
        vendedor: { type: object, properties: { nomePublico: { type: string }, cidade: { type: string } } }
        vendedoraId:
          type: string
          description: conta da vendedora (gravada pelo anúncio, Módulo 02). Sem ela, a peça não pode ser vendida.
        descricao: { type: string }
        medidas: { type: object, additionalProperties: { type: number }, description: em centímetros }
        status:
          type: string
          enum: [disponivel, reservada, vendida]
          description: reserva vencida já volta como `disponivel`
        reservadaAte: { type: [string, "null"], format: date-time }
        criadoEm: { type: string, format: date-time }
    PaginaVitrine:
      type: object
      required: [itens, total, pagina, porPagina]
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/Peca" }, description: só as peças desta página }
        total: { type: integer, description: "total de peças que atendem aos filtros, somando todas as páginas" }
        pagina: { type: integer, minimum: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 48 }
    Erro:
      type: object
      required: [erro]
      properties:
        erro: { type: string }
        campos: { type: object, additionalProperties: { type: string } }
  responses:
    Pedido: { description: pedido, content: { application/json: { schema: { $ref: "#/components/schemas/Pedido" } } } }
    Invalido: { description: dados inválidos, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    SemLogin: { description: sem token ou token inválido, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    Proibido: { description: "não é dona do pedido, não pode fazer esta ação ou não é administradora", content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    NaoEncontrado: { description: não encontrado, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    TransicaoInvalida: { description: transição de status inválida, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
    SaldoInsuficiente: { description: valor maior que o saldo disponível, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }

paths:
  /gestao/interno/pedidos:
    post:
      tags: [interno]
      summary: Cria o pedido (checkout, Módulo 04). Congela a comissão vigente e divide o valor.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compradoraId, vendedoraId, itens, freteCentavos, endereco]
              properties:
                compradoraId: { type: string }
                vendedoraId: { type: string, description: diferente da compradora }
                itens: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/Item" } }
                freteCentavos: { type: integer, minimum: 0 }
                endereco: { type: object, additionalProperties: { type: string } }
      responses:
        "201": { $ref: "#/components/responses/Pedido" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { description: X-API-Key ausente ou inválida }
  /gestao/interno/pedidos/{id}/pagamento-confirmado:
    post:
      tags: [interno]
      summary: Webhook do Pix confirmado → PAGO; lança o valor da vendedora como pendente
      description: Idempotente. Se o pedido já está PAGO, responde 200 com ele e não lança de novo na carteira.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "401": { description: X-API-Key ausente ou inválida }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }
  /gestao/interno/pedidos/{id}/expirar:
    post:
      tags: [interno]
      summary: Pix expirado → CANCELADO
      description: Idempotente. Se o pedido já está CANCELADO, responde 200 com ele. Pedido já pago só a administração cancela (403).
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }

  /gestao/pedidos/compras:
    get:
      tags: [pedidos]
      summary: Compras da usuária logada (sem o endereço)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/status" }]
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { pedidos: { type: array, items: { $ref: "#/components/schemas/Pedido" } } } } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
  /gestao/pedidos/vendas:
    get:
      tags: [pedidos]
      summary: Vendas da usuária logada (com o endereço de entrega)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/status" }]
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { pedidos: { type: array, items: { $ref: "#/components/schemas/Pedido" } } } } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
  /gestao/pedidos/{id}:
    get:
      tags: [pedidos]
      summary: Um pedido (só a compradora, a vendedora ou a administradora master)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
  /gestao/pedidos/{id}/enviar:
    post:
      tags: [pedidos]
      summary: PAGO → ENVIADO (só a vendedora do pedido)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }
  /gestao/pedidos/{id}/confirmar-recebimento:
    post:
      tags: [pedidos]
      summary: ENVIADO → ENTREGUE (só a compradora). Libera o saldo da vendedora.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }
  /gestao/pedidos/{id}/cancelar:
    post:
      tags: [pedidos]
      summary: AGUARDANDO_PAGAMENTO → CANCELADO (só a compradora)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }

  /gestao/carteira:
    get:
      tags: [carteira]
      summary: Saldo pendente, disponível, em saque e extrato (livro-razão)
      security: [{ token: [] }]
      responses:
        "200": { description: carteira, content: { application/json: { schema: { $ref: "#/components/schemas/Carteira" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
  /gestao/carteira/repasses:
    get:
      tags: [carteira]
      summary: Saques da vendedora logada
      security: [{ token: [] }]
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { repasses: { type: array, items: { $ref: "#/components/schemas/Repasse" } } } } } } }
    post:
      tags: [carteira]
      summary: Solicita um saque (nunca maior que o disponível menos o que já está em saque)
      security: [{ token: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [valorCentavos], properties: { valorCentavos: { type: integer, minimum: 1 } } } } }
      responses:
        "201": { description: solicitação criada, content: { application/json: { schema: { $ref: "#/components/schemas/Repasse" } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "422": { $ref: "#/components/responses/SaldoInsuficiente" }

  /gestao/admin/resumo:
    get:
      tags: [admin]
      summary: Visão geral (pedidos por status, vendas, comissão e repasses)
      security: [{ token: [] }]
      responses:
        "200":
          description: resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  pedidosPorStatus: { type: object, additionalProperties: { type: integer } }
                  vendas: { type: object, properties: { quantidade: { type: integer }, totalCentavos: { type: integer }, comissaoCentavos: { type: integer }, taxaPixCentavos: { type: integer } } }
                  repasses: { type: object, additionalProperties: { type: object, properties: { quantidade: { type: integer }, totalCentavos: { type: integer } } } }
                  comissaoPontosBase: { type: integer }
                  taxaPixPontosBase: { type: integer }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/dashboard:
    get:
      tags: [admin]
      summary: Painel de vendas (só pedidos pagos, enviados ou entregues). Com demo=1, números FICTÍCIOS marcados com demonstracao=true, nunca gravados.
      security: [{ token: [] }]
      parameters:
        - { name: periodo, in: query, schema: { type: string, enum: ["30d", "90d", "12m", tudo], default: "12m" }, description: "30d agrupa por dia, 90d por semana, 12m e tudo por mês (tudo: até 24 meses)" }
        - { name: demo, in: query, schema: { type: string, enum: ["0", "1"], default: "0" } }
      responses:
        "200":
          description: dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  demonstracao: { type: boolean }
                  periodo: { type: string }
                  granularidade: { type: string, enum: [dia, semana, mes] }
                  totais:
                    type: object
                    properties:
                      pedidos: { type: integer }
                      pecas: { type: integer }
                      vendasCentavos: { type: integer }
                      comissaoCentavos: { type: integer }
                      taxaPixCentavos: { type: integer }
                      ticketMedioCentavos: { type: integer }
                      comissaoPorPecaCentavos: { type: integer }
                  serie: { type: array, items: { type: object, properties: { inicio: { type: string, format: date }, pedidos: { type: integer }, vendasCentavos: { type: integer }, comissaoCentavos: { type: integer } } } }
                  porUf: { type: array, items: { type: object, properties: { uf: { type: string }, pedidos: { type: integer }, vendasCentavos: { type: integer } } } }
                  cidades: { type: array, items: { type: object, properties: { cidade: { type: string }, uf: { type: string }, pedidos: { type: integer } } } }
                  porCategoria: { type: array, items: { type: object, properties: { categoria: { type: string }, pecas: { type: integer }, vendasCentavos: { type: integer } } } }
                  vendedoras: { type: array, items: { type: object, properties: { vendedoraId: { type: string }, nome: { type: string, description: só na demonstração }, pedidos: { type: integer }, vendasCentavos: { type: integer }, recebeCentavos: { type: integer } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/pedidos:
    get:
      tags: [admin]
      summary: Todos os pedidos, com filtro por status
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/status" }]
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { pedidos: { type: array, items: { $ref: "#/components/schemas/Pedido" } } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/pedidos/{id}/cancelar:
    post:
      tags: [admin]
      summary: Cancela pedido aguardando pagamento ou pago (estorna o pendente)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Pedido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { $ref: "#/components/responses/TransicaoInvalida" }
  /gestao/admin/comissao:
    get:
      tags: [admin]
      summary: Comissão atual
      security: [{ token: [] }]
      responses:
        "200": { description: comissão, content: { application/json: { schema: { type: object, properties: { comissaoPontosBase: { type: integer } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
    put:
      tags: [admin]
      summary: Altera a comissão. Vale só para pedidos novos.
      security: [{ token: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [comissaoPontosBase], properties: { comissaoPontosBase: { type: integer, minimum: 0, maximum: 5000 } } } } }
      responses:
        "200": { description: comissão salva, content: { application/json: { schema: { type: object, properties: { comissaoPontosBase: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/config:
    get:
      tags: [admin]
      summary: Regras públicas (comissão, taxa do Pix e tabela de preço sugerido) para o simulador do anúncio. Sem login.
      security: []
      responses:
        "200": { description: configuração atual, content: { application/json: { schema: { $ref: "#/components/schemas/Configuracao" } } } }
  /gestao/admin/configuracao:
    get:
      tags: [admin]
      summary: Comissão, taxa do Pix e tabela de preço sugerido atuais
      security: [{ token: [] }]
      responses:
        "200": { description: configuração, content: { application/json: { schema: { $ref: "#/components/schemas/Configuracao" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/taxa-pix:
    put:
      tags: [admin]
      summary: Altera a taxa do Pix (pontos-base, até 10%). Vale só para pedidos novos.
      security: [{ token: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [taxaPixPontosBase], properties: { taxaPixPontosBase: { type: integer, minimum: 0, maximum: 1000 } } } } }
      responses:
        "200": { description: taxa salva, content: { application/json: { schema: { type: object, properties: { taxaPixPontosBase: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/precos-sugeridos:
    put:
      tags: [admin]
      summary: Troca a tabela de preço sugerido inteira (uma faixa por categoria e condição, sem repetir)
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [faixas], properties: { faixas: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/FaixaPreco" } } } }
      responses:
        "200":
          description: tabela salva
          content: { application/json: { schema: { type: object, properties: { precosSugeridos: { type: array, items: { $ref: "#/components/schemas/FaixaPreco" } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/repasses:
    get:
      tags: [admin]
      summary: Solicitações de saque das vendedoras
      security: [{ token: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [SOLICITADO, PAGO] } }
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { repasses: { type: array, items: { $ref: "#/components/schemas/Repasse" } } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
  /gestao/admin/repasses/{id}/pagar:
    post:
      tags: [admin]
      summary: Registra o Pix manual à vendedora; debita o disponível (nunca maior que ele)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: repasse pago, content: { application/json: { schema: { $ref: "#/components/schemas/Repasse" } } } }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { description: repasse já pago }
        "422": { $ref: "#/components/responses/SaldoInsuficiente" }

  /auth/cadastro:
    post:
      tags: [contas]
      summary: Cria a conta e já abre a sessão (refresh token em cookie httpOnly)
      description: |
        O CPF é validado (11 dígitos e dígitos verificadores) e guardado só cifrado (AES-256-GCM),
        com um HMAC-SHA256 para a restrição UNIQUE. Ele não volta em nenhuma resposta, nem no token.
        E-mail é conferido antes do CPF. Limite de 10 cadastros por hora por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, cpf, senha]
              properties:
                nome: { type: string, maxLength: 120, description: "nome e sobrenome, só letras" }
                email: { type: string, format: email, maxLength: 254 }
                cpf: { type: string, description: "11 dígitos, com ou sem pontuação", examples: ["529.982.247-25", "52998224725"] }
                senha: { type: string, minLength: 8, maxLength: 128, description: com pelo menos uma letra e um número }
      responses:
        "201":
          description: conta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario: { type: object, properties: { id: { type: string, format: uuid }, nome: { type: string }, email: { type: string }, perfil: { type: string } } }
                  accessToken: { type: string }
                  expiraEm: { type: string, format: date-time }
        "400":
          description: "dados inválidos; `campos.cpf`: \"informe seu CPF.\", \"o CPF precisa ter 11 dígitos.\" ou \"CPF inválido. confira os números.\""
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "409":
          description: "e-mail (`campos.email`) ou CPF (`campos.cpf`) já cadastrado; a resposta não repete o CPF nem diz de quem é a conta"
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "429": { description: muitos cadastros do mesmo IP, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }

  /auth/me/vendedora:
    get:
      tags: [vendedora]
      summary: Perfil de vendedora da conta logada (nome público, cidade e chave Pix mascarada)
      security: [{ token: [] }]
      responses:
        "200": { description: perfil (Cache-Control no-store), content: { application/json: { schema: { type: object, properties: { vendedora: { $ref: "#/components/schemas/PerfilVendedora" } } } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
    patch:
      tags: [vendedora]
      summary: Edita nome público (opcional; vazio volta ao primeiro nome) e cidade
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidade]
              properties:
                nomePublico: { type: [string, "null"], maxLength: 40, description: "letras, números, espaço e . - _ &; no máximo 10 números (nada que possa ser um CPF). Vazio, null ou ausente = null (vitrine usa o primeiro nome)" }
                cidade: { type: string, minLength: 2, maxLength: 60, examples: ["Brasília/DF"] }
      responses:
        "200": { description: perfil atualizado, content: { application/json: { schema: { type: object, properties: { vendedora: { $ref: "#/components/schemas/PerfilVendedora" } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
  /auth/me/pix:
    put:
      tags: [vendedora]
      summary: Cadastra ou troca a chave Pix (pede a senha atual). Devolve um token novo com temChavePix.
      description: |
        A chave é validada conforme o tipo, guardada cifrada (AES-256-GCM) e devolvida só mascarada.
        Senha errada conta no limite do login (5 erros → 429 por 15 minutos).
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, chave, senhaAtual]
              properties:
                tipo: { $ref: "#/components/schemas/TipoChavePix" }
                chave: { type: string, maxLength: 120, examples: ["529.982.247-25", "(61) 91234-5678"] }
                senhaAtual: { type: string }
      responses:
        "200":
          description: chave salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendedora: { $ref: "#/components/schemas/PerfilVendedora" }
                  accessToken: { type: string, description: "JWT com temChavePix: true" }
                  expiraEm: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { description: senha atual incorreta }
        "429": { description: muitas senhas erradas seguidas }
  /auth/vendedoras/{id}:
    get:
      tags: [vendedora]
      summary: Perfil público da vendedora (sem e-mail, documento ou chave Pix). Sem login.
      security: []
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: perfil público, content: { application/json: { schema: { type: object, properties: { vendedora: { $ref: "#/components/schemas/PerfilPublicoVendedora" } } } } } }
        "404": { description: "não existe, ainda não é vendedora (sem chave Pix) ou está bloqueada" }

  /auth/admin/usuarios:
    get:
      tags: [admin]
      summary: Lista e busca contas por nome ou e-mail (sem senha nem hash)
      security: [{ token: [] }]
      parameters:
        - { name: busca, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { usuarios: { type: array, items: { $ref: "#/components/schemas/Usuaria" } } } } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
  /auth/admin/usuarios/{id}/bloquear:
    post:
      tags: [admin]
      summary: Bloqueia a conta (não entra nem renova a sessão; as sessões caem). A master não pode ser bloqueada.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: conta bloqueada, content: { application/json: { schema: { type: object, properties: { usuario: { $ref: "#/components/schemas/Usuaria" } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
  /auth/admin/usuarios/{id}/desbloquear:
    post:
      tags: [admin]
      summary: Desbloqueia a conta
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: conta desbloqueada, content: { application/json: { schema: { type: object, properties: { usuario: { $ref: "#/components/schemas/Usuaria" } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /pecas:
    get:
      tags: [vitrine]
      summary: Vitrine com busca, filtros, ordenação e paginação (catálogo). Sem login.
      description: |
        Lista só peças **ativas**: ficam de fora as vendidas e as ocultadas pela administração;
        as reservadas aparecem com `status: reservada`.

        Todos os parâmetros são opcionais e podem ser combinados. Parâmetro vazio (`?busca=`)
        conta como não informado, como o formulário GET da vitrine envia. Parâmetro repetido
        (`?categoria=a&categoria=b`) ou fora das regras → **400** com o campo em `campos`.

        Preços em **centavos inteiros** (`precoMax=9500` = até R$ 95,00). Atenção: na URL da
        página `/catalogo` do site os preços estão em reais; o site converte antes de chamar a API.
      security: []
      parameters:
        - name: busca
          in: query
          description: procura no título, na marca e na descrição, sem diferenciar maiúsculas, minúsculas e acentos ("oculos" acha "Óculos")
          schema: { type: string, maxLength: 100 }
        - name: categoria
          in: query
          schema: { type: string, enum: [feminino, masculino, calcados, bolsas, acessorios] }
        - name: tamanho
          in: query
          description: igual ao tamanho da peça (ex. `M`, `único`, `37`)
          schema: { type: string, maxLength: 20 }
        - name: condicao
          in: query
          schema: { type: string, enum: [nova_com_etiqueta, otimo_estado, bom_estado, com_marcas_de_uso] }
        - name: precoMin
          in: query
          description: preço mínimo em centavos (o próprio valor entra). Não pode ser maior que `precoMax`.
          schema: { type: integer, minimum: 0, maximum: 10000000 }
        - name: precoMax
          in: query
          description: preço máximo em centavos (o próprio valor entra)
          schema: { type: integer, minimum: 0, maximum: 10000000 }
        - name: ordem
          in: query
          description: empate é desempatado pelo id, para a mesma peça não aparecer em duas páginas
          schema: { type: string, enum: [recentes, menor-preco, maior-preco], default: recentes }
        - name: pagina
          in: query
          description: começa em 1. Uma página além do fim devolve `itens` vazio, com o `total` certo.
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: porPagina
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: uma página da vitrine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaVitrine" }
              example:
                itens:
                  - id: demo-bolsa-palha
                    titulo: Bolsa de palha com alça
                    marca: feito à mão
                    categoria: bolsas
                    tamanho: único
                    condicao: otimo_estado
                    precoCentavos: 8990
                    status: disponivel
                    reservadaAte: null
                    criadoEm: "2026-11-14T12:00:00.000Z"
                total: 3
                pagina: 1
                porPagina: 1
        "400":
          description: parâmetro inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: { erro: confira os dados enviados., campos: { precoMin: o preço mínimo não pode ser maior que o máximo. } }
  /pecas/{id}/reservar:
    post:
      tags: [vitrine]
      summary: Coloca a peça na sacola (catálogo). Reserva por 15 minutos no nome de quem está logada.
      description: A vendedora não reserva a própria peça (403). Quem reservou nunca aparece na vitrine.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: peça reservada, content: { application/json: { schema: { $ref: "#/components/schemas/Peca" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { description: outra pessoa reservou ou comprou antes, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /pecas/{id}/liberar:
    post:
      tags: [vitrine]
      summary: Tira a peça da sacola (catálogo). Só quem reservou libera; peça vendida continua vendida.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: peça, content: { application/json: { schema: { $ref: "#/components/schemas/Peca" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { $ref: "#/components/responses/Proibido" }
        "409": { description: a peça está num pedido esperando o Pix, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
  /pedidos:
    post:
      tags: [vitrine]
      summary: Checkout (catálogo). Cria o pedido com o Pix e, pelo CompraFacade, um pedido por vendedora no Módulo 05.
      description: |
        Só com peças reservadas por quem está logada. Preço, frete e total são calculados no servidor.
        Cada vendedora da sacola vira um pedido no Módulo 05 (`/gestao/interno/pedidos`) e cobra o seu
        frete fixo; o Pix é um só, com o total. Se o Módulo 05 falhar, nada é criado (502) e a reserva continua.
      security: [{ token: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comprador, endereco, itens]
              properties:
                comprador: { type: object, properties: { nome: { type: string }, email: { type: string, format: email } } }
                endereco: { type: object, additionalProperties: { type: string } }
                itens: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: ids das peças reservadas }
      responses:
        "201":
          description: pedido aguardando pagamento, com `pixCopiaECola` e `pedidosGestao` (um por vendedora)
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403": { description: a peça é da própria compradora }
        "409": { description: "reserva vencida, de outra conta, já num pedido, ou peça sem vendedora cadastrada" }
        "502": { description: o serviço de pedidos (Módulo 05) recusou ou não respondeu }
        "503": { description: integração com o Módulo 05 desligada (sem API_KEYS) }
  /pedidos/{id}:
    get:
      tags: [vitrine]
      summary: Pedido do checkout, com o Pix (catálogo). Só a compradora vê; para as outras contas, 404.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: pedido }
        "401": { $ref: "#/components/responses/SemLogin" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
  /integracao/pagamentos/{id}/confirmar:
    post:
      tags: [interno]
      summary: Webhook do Pix (catálogo). Confirma os pedidos no Módulo 05 e depois marca as peças como vendidas.
      description: |
        Idempotente. O Módulo 05 é avisado antes de o catálogo mudar: se ele falhar (502), nada muda e o
        webhook pode repetir. Pagamento depois do prazo do Pix cancela o pedido e responde 409.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: pedido pago }
        "401": { description: X-API-Key ausente ou inválida }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409": { description: o prazo do Pix acabou e o pedido foi cancelado }
        "502": { description: o serviço de pedidos (Módulo 05) não respondeu }
  /config:
    get:
      tags: [admin]
      summary: Frete fixo atual e minutos de reserva, para a sacola e o checkout (catálogo). Sem login.
      security: []
      responses:
        "200": { description: regras, content: { application/json: { schema: { type: object, properties: { freteCentavos: { type: integer }, reservaMinutos: { type: integer } } } } } }
  /admin/frete:
    get:
      tags: [admin]
      summary: Frete fixo atual (catálogo)
      security: [{ token: [] }]
      responses:
        "200": { description: frete, content: { application/json: { schema: { type: object, properties: { freteCentavos: { type: integer } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
    put:
      tags: [admin]
      summary: Altera o frete fixo (centavos, até R$ 200,00). Vale para pedidos novos.
      security: [{ token: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [freteCentavos], properties: { freteCentavos: { type: integer, minimum: 0, maximum: 20000 } } } } }
      responses:
        "200": { description: frete salvo, content: { application/json: { schema: { type: object, properties: { freteCentavos: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "403": { $ref: "#/components/responses/Proibido" }
  /admin/pecas:
    get:
      tags: [admin]
      summary: Todos os anúncios, inclusive os ocultos, com a marca de irregular
      security: [{ token: [] }]
      responses:
        "200": { description: lista, content: { application/json: { schema: { type: object, properties: { pecas: { type: array, items: { $ref: "#/components/schemas/AnuncioAdmin" } } } } } } }
        "403": { $ref: "#/components/responses/Proibido" }
  /admin/pecas/{id}/ocultar:
    post:
      tags: [admin]
      summary: Oculta o anúncio (some da vitrine, da página e da reserva)
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { motivo: { type: string, maxLength: 200 } } } } }
      responses:
        "200": { description: anúncio oculto, content: { application/json: { schema: { $ref: "#/components/schemas/AnuncioAdmin" } } } }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
  /admin/pecas/{id}/reexibir:
    post:
      tags: [admin]
      summary: Volta a mostrar o anúncio. Fora das categorias permitidas → 422.
      security: [{ token: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: anúncio visível, content: { application/json: { schema: { $ref: "#/components/schemas/AnuncioAdmin" } } } }
        "403": { $ref: "#/components/responses/Proibido" }
        "422": { description: categoria não permitida, content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } } }
