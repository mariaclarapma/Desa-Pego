# Hospedagem no Render (plano grátis): um único serviço roda o site (Next.js), o serviço de contas
# e o catálogo, como no `npm run dev`. Contas, pedidos e catálogo ficam no PostgreSQL do Supabase
# (DATABASE_URL); as fotos dos anúncios, no Supabase Storage (SUPABASE_URL e SUPABASE_SECRET_KEY).
# Passo a passo no README, seção "Hospedagem".
services:
  - type: web
    name: desapego
    runtime: node
    plan: free
    # mesma região do banco no Supabase (us-east-2, Ohio): menos atraso em cada consulta
    region: ohio
    branch: main
    # --include=dev: o build do Next.js e o esbuild (que empacota os serviços) são devDependencies
    buildCommand: npm ci --include=dev && npm run build
    # o mesmo que `npm start`, sem o processo do npm na frente: no plano grátis (512 MB) cada MB conta.
    # Sobe os três serviços num processo `node` e o site noutro (scripts/iniciar.mjs).
    startCommand: node scripts/iniciar.mjs
    # passa pelo site e pelo proxy até o serviço de contas: se responder, está tudo de pé
    healthCheckPath: /api/auth/saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # o Render gera um segredo aleatório na criação; não precisa mexer
      - key: JWT_SECRET
        generateValue: true
      # CPF das contas (Req. 001): gere cada uma com `openssl rand -base64 32`, cole no painel e guarde
      # no cofre do grupo NA HORA. Sem generateValue de propósito: recriar o serviço geraria chaves novas,
      # os CPFs ficariam ilegíveis e o banco deixaria de pegar CPF repetido. Veja docs/CPF.md.
      - key: CPF_CRIPTO_CHAVE
        sync: false
      - key: CPF_HASH_CHAVE
        sync: false
      # cole a URL do Supabase (Connect → Session pooler) no painel; nunca no repositório
      - key: DATABASE_URL
        sync: false
      # fotos dos anúncios no Supabase Storage (docs/FOTOS.md): endereço do projeto e secret key,
      # só no painel. A URL também é lida no build (CSP e next/image): mudou, faça novo deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # o Next.js (loopback) e o balanceador do Render (rede interna) ficam na frente do serviço de contas
      - key: TRUST_PROXY
        value: loopback, uniquelocal
      # chave da API de integração (X-API-Key): o Render gera uma aleatória; o site usa a mesma
      # no botão "simular pagamento" (no servidor). Para dar uma chave a um parceiro, copie do painel.
      - key: API_KEYS
        generateValue: true
      # origem do site liberada no CORS (troque se usar outro domínio)
      - key: CORS_ORIGENS
        value: https://desapego.onrender.com
      # chave que cifra as chaves Pix (Req. 002): gere com `openssl rand -base64 32`, cole no painel
      # e guarde uma cópia no cofre de senhas do grupo. Não use generateValue: se o serviço for
      # recriado, uma chave nova deixaria ilegíveis as chaves Pix salvas. Veja docs/CHAVE-PIX.md
      - key: PIX_CRIPTO_CHAVE
        sync: false
      # administradora master (Lucy): preencha no painel do Render, nunca no repositório
      - key: ADMIN_MASTER_EMAIL
        sync: false
      - key: ADMIN_MASTER_PASSWORD
        sync: false
