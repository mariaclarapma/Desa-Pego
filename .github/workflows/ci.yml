name: CI

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desapego
          POSTGRES_PASSWORD: desapego
          POSTGRES_DB: desapego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desapego"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://desapego:desapego@localhost:5432/desapego_test
      REDIS_URL: redis://localhost:6379
      PIX_PROVIDER: simulado
      # os testes do serviço de contas rodam contra este Postgres (cada arquivo num schema próprio)
      TEST_DATABASE_URL: postgresql://desapego:desapego@localhost:5432/desapego_test

    steps:
      - uses: actions/checkout@v4

      # Enquanto o projeto ainda não tiver package.json/package-lock.json,
      # a CI só avisa e passa. Quando a equipe criar o código, os passos abaixo rodam.
      - name: Aviso (projeto Node ainda não criado)
        if: hashFiles('package-lock.json') == ''
        run: echo "::notice::Sem package-lock.json na raiz; lint e testes serão pulados."

      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint

      - name: Typecheck
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck

      - name: Testes (Vitest)
        if: hashFiles('package-lock.json') != ''
        run: npm test

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build

      # sobe tudo como no Render (npm start, modo produção, Postgres real) e confere as três peças
      - name: Teste de fumaça (npm start como no Render)
        if: hashFiles('package-lock.json') != ''
        env:
          NODE_ENV: production
          PORT: 4000
          DATABASE_URL: postgresql://desapego:desapego@localhost:5432/desapego_test
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          export API_KEYS="$(openssl rand -hex 24)"
          export CORS_ORIGENS="http://localhost:4000"
          npm start > start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/auth/saude > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4000/api/auth/saude
          curl -sf -o /dev/null http://localhost:4000/api/pecas
          curl -sf http://localhost:4000/api/gestao/saude
          curl -sf -o /dev/null http://localhost:4000/
          echo "site, catálogo, contas e pedidos respondendo"

      - name: Log do npm start (se o teste de fumaça falhar)
        if: failure()
        run: cat start.log || true

  e2e:
    name: E2E (Cypress) e acessibilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # o binário do Cypress fica em cache entre execuções
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      # build, sobe site + contas + catálogo e roda os fluxos (login, navegação, CRUD, compra) com axe
      - name: Testes E2E
        run: npm run e2e

      - name: Capturas de tela das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  gitleaks:
    name: Detecção de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar e rodar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
